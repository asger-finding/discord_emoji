name: Scrape

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run scrape
      - name: Commit if Discord's table changed
        run: |
          git diff --quiet -- index.js && exit 0
          npm run lint
          npm test
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'chore: update emojis from Discord' -- index.js index.cjs index.d.ts index.d.cts
          git push
